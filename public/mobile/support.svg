<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="bg-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="600" fill="url(#bg-s)"/>
  <text x="150" y="50" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="500" fill="#f0f0f0">Adaeze’s Bookshop</text>
  <text x="150" y="75" text-anchor="middle" font-family="system-ui" font-size="11" fill="#999">Lagos · 124 supporters</text>
  <g transform="translate(30 110)">
