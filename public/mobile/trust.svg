<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="bg-t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="600" fill="url(#bg-t)"/>
  <text x="150" y="50" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="600" fill="#f0f0f0">Trust &amp; Transparency</text>
  <g transform="translate(20 90)">
    <rect width="260" height="64" rx="16" fill="#1a3a28"/>
    <circle cx="32" cy="32" r="16" fill="#22c55e"/>
