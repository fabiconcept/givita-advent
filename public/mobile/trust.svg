    <text x="58" y="46" font-family="system-ui" font-size="10" fill="#999">BVN &amp; ID check passed</text>
  </g>
  <g transform="translate(20 170)">
    <rect width="260" height="64" rx="16" fill="#1e1e1e" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="32" cy="32" r="16" fill="#512ef8"/>
    <text x="58" y="28" font-family="system-ui" font-size="12" font-weight="500" fill="#f0f0f0">Milestones shared</text>
    <text x="58" y="46" font-family="system-ui" font-size="10" fill="#999">3 of 3 updates posted</text>
  </g>
  <g transform="translate(20 250)">
